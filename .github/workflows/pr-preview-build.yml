name: PR Preview Build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number for manual runs (optional)"
        required: false
        type: string

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_ID: ${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 'stable'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -d -b /usr/local/bin

      - name: Install Chat Dependencies
        run: cd chat && bun install

      - name: Run task gen and check for unstaged changes
        run: |
          task gen
          ./check_unstaged.sh

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          build_variants=(
            "linux amd64 agentapi-linux-amd64"
            "linux arm64 agentapi-linux-arm64"
            "darwin amd64 agentapi-darwin-amd64"
            "darwin arm64 agentapi-darwin-arm64"
            "windows amd64 agentapi-windows-amd64.exe"
          )

          for variant in "${build_variants[@]}"; do
            read -r goos goarch artifact_name <<< "$variant"

            echo "Building for GOOS=$goos GOARCH=$goarch..."
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch BINPATH="out/$artifact_name" task build:go
          done

      - name: Upload Build Artifact
        uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agentapi-build-${{ env.PR_ID }}
          path: ./out
          retention-days: 30