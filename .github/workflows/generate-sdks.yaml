name: Generate All SDKs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'openapi.json'
      - 'internal/**/*.go'
  workflow_dispatch:

jobs:
  generate-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8b5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 'stable'

      - name: Install generators
        run: |
          npm install @openapitools/openapi-generator-cli -g
          pip install openapi-python-client

      - name: Generate Python SDK
        run: |
          openapi-generator generate -i openapi.json -g python -o sdk/python --package-name agentapi

      - name: Generate TypeScript SDK
        run: |
          openapi-generator generate -i openapi.json -g typescript-fetch -o sdk/typescript

      - name: Generate Go SDK
        run: |
          openapi-generator generate -i openapi.json -g go -o sdk/go

      - name: Commit and push
        run: |
          git add sdk/
          git commit -m "chore: generate all SDKs" || echo "No changes to commit"
          git push
