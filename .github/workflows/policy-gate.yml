name: Policy Gate
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy-gate:
    name: policy-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8b5
        with:
          fetch-depth: 0

      - name: Check commit message format
        run: |
          git log --format=%s origin/main..HEAD | while read -r msg; do
            if ! echo "$msg" | grep -qE '^(feat|fix|chore|ci|docs|refactor|test|style|perf|build|revert)(\(.+\))?: .+'; then
              echo "Invalid commit message: $msg"
              exit 1
            fi
          done
