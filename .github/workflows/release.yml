name: Build Release Binaries

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      create-artifact:
        description: 'Create build artifact'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 'stable'

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

    - name: Install Task
      run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -d -b /usr/local/bin

    - name: Install Chat Dependencies
      run: cd chat && bun install

    - name: Run task gen and check for unstaged changes
      run: |
        task gen
        ./check_unstaged.sh

    - name: Build and Upload
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        build_variants=(
          "linux amd64 agentapi-linux-amd64"
          "linux arm64 agentapi-linux-arm64"
          "darwin amd64 agentapi-darwin-amd64"
          "darwin arm64 agentapi-darwin-arm64"
          "windows amd64 agentapi-windows-amd64.exe"
        )

        for variant in "${build_variants[@]}"; do
          read -r goos goarch artifact_name <<< "$variant"

          echo "Building for GOOS=$goos GOARCH=$goarch..."
          CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch BINPATH="out/$artifact_name" task build:go
        done

    - name: Upload Build Artifact
      if: ${{ inputs.create-artifact }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: agentapi-build
        path: ${{ github.workspace }}/out
        retention-days: 7

    - name: Upload Release Assets
      if: ${{ github.event_name == 'release' }}
      run: gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE"/out/* --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
