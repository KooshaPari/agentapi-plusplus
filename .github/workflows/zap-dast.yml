name: ZAP DAST
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'openapi.json'
  workflow_dispatch:

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: ZAP DAST scan placeholder
        run: |
          echo "DAST scanning requires a running instance."
          echo "This is a placeholder for when the service is deployed."
          echo "To enable: deploy service, then run ZAP against the live endpoint."
